name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install terminal test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect jq
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go vet -tags=e2e ./...
      - run: go test -race ./...
      - run: go test -race -tags=e2e -run '^TestProxyHeaderParity$' -count=1 ./scripts
      - run: go build -trimpath ./...
