# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: tr -d '[:space:]' < version.txt
  BENCH_TIME: 300ms
  BENCH_COUNT: '3'
  PERF_CASE: near_cap
  PROFILE_TIME: 10x
  RESOURCE_COUNT: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build bin/sig
    cmds:
      - go build -trimpath -ldflags "-X github.com/sprisa/sig/cmd.Version=v{{.VERSION}}" -o bin/sig .

  install:
    desc: Install sig into GOBIN (or GOPATH/bin)
    cmds:
      - go install -trimpath -ldflags "-X github.com/sprisa/sig/cmd.Version=v{{.VERSION}}" .

  assets:
    desc: Render the 1280x640 GitHub social preview (requires librsvg)
    cmds:
      - rsvg-convert --width 1280 --height 640 --output docs/assets/social-preview.png docs/assets/social-preview.svg

  build:go:
    desc: Cross-build snapshot binaries with GoReleaser (no publishing)
    env:
      GORELEASER_CURRENT_TAG: 'v{{.VERSION}}'
    cmds:
      - goreleaser build --snapshot --clean

  build:npm:
    desc: Build npm packages for all six platforms (no publishing)
    deps: [release:version]
    env:
      CGO_ENABLED: '0'
      GOFLAGS: "'-ldflags=-s -w -X github.com/sprisa/sig/cmd.Version=v{{.VERSION}}'"
    cmds:
      - npx --yes @sprisa/npmreleaser@latest build --clean
      # Normalize npmreleaser's scoped-package metadata before packing.
      - npm --prefix ./dist/npm/@sprisa/sig pkg set --json 'bin={"sig":"sig"}' 'files=["sig","README.md","LICENSE"]'
      - chmod 755 ./dist/npm/@sprisa/sig/sig

  release:check:
    desc: Validate release configuration
    cmds:
      - goreleaser check
      - jq empty npmreleaser.json

  release:snapshot:
    desc: Build snapshot archives and checksums with GoReleaser (no publishing)
    env:
      GORELEASER_CURRENT_TAG: 'v{{.VERSION}}'
    cmds:
      - goreleaser release --snapshot --clean

  release:npm:dry-run:
    desc: Build and inspect npm packages without publishing
    cmds:
      - task: release:npm
        vars:
          PUBLISH_ARGS: --dry-run

  release:npm:
    desc: Build and publish npm platform packages, then the wrapper
    deps: [build:npm]
    vars:
      NPM_TAG: '{{if contains "-" .VERSION}}next{{else}}latest{{end}}'
    cmds:
      - |
        for package in ./dist/npm/@sprisa/sig_*; do
          npm publish "$package" --access public --tag '{{.NPM_TAG}}' {{.PUBLISH_ARGS | default ""}} || exit $?
        done
        npm publish ./dist/npm/@sprisa/sig --access public --tag '{{.NPM_TAG}}' {{.PUBLISH_ARGS | default ""}}

  release:github:
    desc: Upload prepared GoReleaser archives to a GitHub release
    cmds:
      - git push origin HEAD
      - git push origin 'v{{.VERSION}}'
      - >-
        gh release create 'v{{.VERSION}}'
        ./dist/goreleaser/*.tar.gz ./dist/goreleaser/*.zip ./dist/goreleaser/checksums.txt
        --repo sprisa/sig --title 'v{{.VERSION}}' --verify-tag --generate-notes
        {{if contains "-" .VERSION}}--prerelease{{end}}

  release:version:
    internal: true
    cmds:
      - mkdir -p dist
      - jq --arg version '{{.VERSION}}' '."package.json".version = $version' npmreleaser.json > dist/npmreleaser.json
      - mv dist/npmreleaser.json npmreleaser.json

  release:tag:
    internal: true
    deps: [release:version]
    cmds:
      - git add -- version.txt npmreleaser.json
      - |
        if ! git diff --cached --quiet -- version.txt npmreleaser.json; then
          git commit -m 'chore: release v{{.VERSION}}' -- version.txt npmreleaser.json
        fi
      - |
        if git rev-parse --verify 'refs/tags/v{{.VERSION}}' >/dev/null 2>&1; then
          test "$(git rev-list -n 1 'v{{.VERSION}}')" = "$(git rev-parse HEAD)"
        else
          git tag -a 'v{{.VERSION}}' -m 'v{{.VERSION}}'
        fi

  publish:
    desc: Commit and tag version.txt, build archives, publish npm, then create the GitHub release
    preconditions:
      - sh: git diff --quiet HEAD -- . ':!version.txt' ':!npmreleaser.json'
        msg: Commit code changes before publishing; only release metadata may be modified
      - sh: test -z "$(git ls-files --others --exclude-standard -- . ':!version.txt' ':!npmreleaser.json')"
        msg: Commit new project files before publishing
      - sh: gh auth status >/dev/null 2>&1
        msg: Run gh auth login first
      - sh: npm whoami >/dev/null 2>&1
        msg: Run npm login first
    cmds:
      - task: release:tag
      - goreleaser release --clean --skip=publish
      - task: release:npm
      - task: release:github

  test:
    desc: Run synthetic unit and HTTP integration tests (no credentials required)
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report test coverage
    cmds:
      - go test -cover ./...

  test:e2e:
    desc: Run opt-in live smoke tests using SIGNOZ_URL and SIGNOZ_API_KEY (requires OS keychain)
    cmds:
      - bash scripts/e2e.sh

  test:api:
    desc: Compare CLI results with direct API requests (opt-in live test)
    cmds:
      - go test -tags=e2e -run '^TestLiveAPIParity$' -count=1 -v ./scripts

  test:proxy:
    desc: Test the compiled CLI and direct API harness behind a synthetic auth proxy (no credentials required)
    cmds:
      - go test -race -tags=e2e -run '^TestProxyHeaderParity$' -count=1 ./scripts

  test:repeat:
    desc: Repeat race-enabled tests with randomized order
    cmds:
      - go test -race -shuffle=on -count=3 ./...

  perf:
    desc: Run synthetic allocation and throughput benchmarks (no race detector)
    cmds:
      - go test -trimpath -run '^$' -bench . -benchmem -benchtime '{{.BENCH_TIME}}' -count '{{.BENCH_COUNT}}' ./tests

  perf:throughput:
    desc: Benchmark the real search, pagination, and JSON output pipeline over loopback
    cmds:
      - go test -trimpath -run '^$' -bench '^BenchmarkSearchAndOutput$' -benchmem -benchtime '{{.BENCH_TIME}}' -count '{{.BENCH_COUNT}}' ./tests

  perf:decode:
    desc: Compare nested RawMessage decoding with a direct typed-envelope experiment
    cmds:
      - go test -trimpath -run '^$' -bench '^BenchmarkDecodeStrategies$' -benchmem -benchtime '{{.BENCH_TIME}}' -count '{{.BENCH_COUNT}}' ./tests

  perf:encode:
    desc: Isolate raw-row JSON encoding costs (buffer pools may be reused)
    cmds:
      - go test -trimpath -run '^$' -bench '^BenchmarkEncodeRawRows$' -benchmem -benchtime '{{.BENCH_TIME}}' -count '{{.BENCH_COUNT}}' ./tests

  perf:profile:
    desc: Capture CPU and allocation profiles under ignored bin/perf
    cmds:
      - mkdir -p bin/perf
      - go test -trimpath -run '^$' -bench '^BenchmarkSearchAndOutput$/{{.PERF_CASE}}$' -benchmem -benchtime '{{.PROFILE_TIME}}' -count=1 -cpuprofile '{{.ROOT_DIR}}/bin/perf/cpu.pprof' -memprofile '{{.ROOT_DIR}}/bin/perf/alloc.pprof' -o '{{.ROOT_DIR}}/bin/perf/bench.test' ./tests

  perf:alloc:
    desc: Show cumulative allocation hotspots from the latest performance profile
    preconditions:
      - sh: test -f bin/perf/alloc.pprof
        msg: Run task perf:profile first
    cmds:
      - go tool pprof -top -alloc_space bin/perf/bench.test bin/perf/alloc.pprof

  perf:cpu:
    desc: Show CPU hotspots from the latest performance profile
    preconditions:
      - sh: test -f bin/perf/cpu.pprof
        msg: Run task perf:profile first
    cmds:
      - go tool pprof -top bin/perf/bench.test bin/perf/cpu.pprof

  perf:resources:
    desc: Measure compiled CLI CPU/RSS and retained heap using synthetic data (macOS/Linux)
    deps: [build]
    cmds:
      - go test -trimpath -run '^(TestProcessResources|TestRetainedHeap)$' -count=1 -v ./tests -args -resource-binary '{{.ROOT_DIR}}/bin/sig' -resource-count '{{.RESOURCE_COUNT}}'

  vuln:
    desc: Scan reachable Go vulnerabilities (requires network access)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Check Go formatting without modifying files
    cmds:
      - test -z "$(gofmt -l .)"

  vet:
    desc: Run Go static checks
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  check:
    desc: Check formatting, static analysis, and race-tested behavior
    deps: [fmt:check, vet, test:race, test:proxy]
